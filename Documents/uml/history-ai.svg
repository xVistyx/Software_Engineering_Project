.6" marker-end="url(#arrow)" /><text x="592.0" y="714" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="592.0,701,416.0,42"><tspan x="592.0" dy="0">Store optional result against original record</tspan></text><rect x="45" y="810" width="700" height="120" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="61" y="842" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,824,668,32"><tspan x="61" dy="0">«note» Honest presentation</tspan></text><line x1="45" y1="862" x2="745" y2="862" stroke="#bcb6c8" /><text x="61" y="893" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,877,668,44"><tspan x="61" dy="0">Summary-only records offer summary JSON/CSV.</tspan><tspan x="61" dy="23">Detailed visits/events remain available for older archives.</tspan></text><rect x="845" y="810" width="710" height="120" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="861" y="842" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="861,824,678,32"><tspan x="861" dy="0">«note» Existing AI workflow</tspan></text><line x1="845" y1="862" x2="1555" y2="862" stroke="#bcb6c8" /><text x="861" y="893" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="861,877,678,44"><tspan x="861" dy="0">No new model is added. The evaluator is still a stub.</tspan><tspan x="861" dy="23">Dashboard remains usable without returned analysis.</tspan></text></svg>