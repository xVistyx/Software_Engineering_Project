<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>05 / Lifecycle and persistence are separate</title><desc>The DTO arrives after completion; its storage status can still be pending.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">05 / Lifecycle and persistence are separate</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">The DTO arrives after completion; its storage status can still be pending.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="45" y="170" width="420" height="155" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="61" y="202" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,184,388,32"><tspan x="61" dy="0">«component» Running / paused</tspan></text><line x1="45" y1="222" x2="465" y2="222" stroke="#bcb6c8" /><text x="61" y="253" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,237,388,79"><tspan x="61" dy="0">Session coordinator owns active state</tspan><tspan x="61" dy="23">Temporary manager writes checkpoints</tspan></text><rect x="590" y="170" width="420" height="155" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="606" y="202" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="606,184,388,32"><tspan x="606" dy="0">«component» Ended / pending</tspan></text><line x1="590" y1="222" x2="1010" y2="222" stroke="#bcb6c8" /><text x="606" y="253" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="606,237,388,79"><tspan x="606" dy="0">End time and DTO are durable in JSON</tspan><tspan x="606" dy="23">System attempts permanent save</tspan></text><rect x="1135" y="170" width="420" height="155" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="1151" y="202" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="1151,184,388,32"><tspan x="1151" dy="0">«component» Saved</tspan></text><line x1="1135" y1="222" x2="1555" y2="222" stroke="#bcb6c8" /><text x="1151" y="253" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="1151,237,388,79"><tspan x="1151" dy="0">SQL contains the summary</tspan><tspan x="1151" dy="23">Temporary JSON has been removed</tspan></text><polyline points="465,245 590,245" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="475" y="216" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="475,202,113,52"><tspan x="475" dy="0">stop / expiry</tspan></text><polyline points="1010,245 1135,245" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="1018" y="216" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="1018,202,115,52"><tspan x="1018" dy="0">commit +</tspan><tspan x="1018" dy="21">delete</tspan></text><polyline points="800,325 800,430 965,430 965,325" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="820" y="452" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="820,438,300,52"><tspan x="820" dy="0">failure: retain and retry</tspan></text><rect x="45" y="570" width="705" height="225" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="61" y="602" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,584,673,32"><tspan x="61" dy="0">«note» Restart recovery</tspan></text><line x1="45" y1="622" x2="750" y2="622" stroke="#bcb6c8" /><text x="61" y="653" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,637,673,149"><tspan x="61" dy="0">Pending DTO: replay its frozen values.</tspan><tspan x="61" dy="23">Unfinished work: close at the saved checkpoint.</tspan><tspan x="61" dy="23">Unknown offline time is excluded.</tspan><tspan x="61" dy="23">No guessing of owner from shared legacy files.</tspan></text><rect x="840" y="570" width="715" height="225" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="856" y="602" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="856,584,683,32"><tspan x="856" dy="0">«note» Identity and timing</tspan></text><line x1="840" y1="622" x2="1555" y2="622" stroke="#bcb6c8" /><text x="856" y="653" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="856,637,683,149"><tspan x="856" dy="0">Large integer IDs preserve the team DTO contract.</tspan><tspan x="856" dy="23">Owner + session ID scopes SQL and retries.</tspan><tspan x="856" dy="23">Actual duration follows the team wall-time calculation.</tspan><tspan x="856" dy="23">A paused session can have a longer actual duration.</tspan></text></svg>