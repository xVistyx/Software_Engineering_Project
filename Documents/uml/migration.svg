<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>07 / Integration and existing data</title><desc>Integration branch starts directly at the colleague’s StopSession commit bb5b28d.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">07 / Integration and existing data</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">Integration branch starts directly at the colleague’s StopSession commit bb5b28d.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="45" y="170" width="455" height="230" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="61" y="202" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,184,423,32"><tspan x="61" dy="0">«Git» Local recovery snapshot</tspan></text><line x1="45" y1="222" x2="500" y2="222" stroke="#bcb6c8" /><text x="61" y="253" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,237,423,154"><tspan x="61" dy="0">backup/sql-before-team-summary-20260915</tspan><tspan x="61" dy="23">Commit 07dd303 preserves earlier work</tspan><tspan x="61" dy="23">No old source work was discarded</tspan><tspan x="61" dy="23">No changes were pushed</tspan></text><rect x="575" y="170" width="455" height="230" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="591" y="202" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="591,184,423,32"><tspan x="591" dy="0">«Git» Current integration</tspan></text><line x1="575" y1="222" x2="1030" y2="222" stroke="#bcb6c8" /><text x="591" y="253" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="591,237,423,154"><tspan x="591" dy="0">feature/sql-summary-integration</tspan><tspan x="591" dy="23">Team session classes retained</tspan><tspan x="591" dy="23">SQL summary storage + History added</tspan><tspan x="591" dy="23">DTO class fields unchanged</tspan></text><rect x="1105" y="170" width="450" height="230" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="1121" y="202" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="1121,184,418,32"><tspan x="1121" dy="0">«storage» Database continuity</tspan></text><line x1="1105" y1="222" x2="1555" y2="222" stroke="#bcb6c8" /><text x="1121" y="253" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="1121,237,418,154"><tspan x="1121" dy="0">Same configured SQLite file</tspan><tspan x="1121" dy="23">No new server or schema upgrade</tspan><tspan x="1121" dy="23">Existing summaries/visits remain readable</tspan><tspan x="1121" dy="23">User-scoped keys remain valid</tspan></text><rect x="45" y="560" width="710" height="230" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="61" y="592" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,574,678,32"><tspan x="61" dy="0">«note» Legacy JSON imports</tspan></text><line x1="45" y1="612" x2="755" y2="612" stroke="#bcb6c8" /><text x="61" y="643" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,627,678,154"><tspan x="61" dy="0">Stop the backend before importing.</tspan><tspan x="61" dy="23">Use DataBase.manage import-legacy USER_ID SOURCE.</tspan><tspan x="61" dy="23">Assign the actual owner explicitly.</tspan><tspan x="61" dy="23">Sources remain untouched; imports are repeatable.</tspan></text><rect x="845" y="560" width="710" height="230" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="861" y="592" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="861,574,678,32"><tspan x="861" dy="0">«note» Team boundary</tspan></text><line x1="845" y1="612" x2="1555" y2="612" stroke="#bcb6c8" /><text x="861" y="643" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="861,627,678,154"><tspan x="861" dy="0">UserSessionDataManager owns temporary files.</tspan><tspan x="861" dy="23">UserSessionCoordinator requests their deletion.</tspan><tspan x="861" dy="23">DataBaseManager owns permanent summaries.</tspan><tspan x="861" dy="23">System coordinates save, acknowledgment, and reads.</tspan></text></svg>