<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>01 / Team summary storage flow</title><desc>The session component owns temporary data. System passes the completed DTO to permanent storage.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">01 / Team summary storage flow</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">The session component owns temporary data. System passes the completed DTO to permanent storage.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="45" y="165" width="340" height="185" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="61" y="197" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,179,308,32"><tspan x="61" dy="0">«component» Frontend</tspan></text><line x1="45" y1="217" x2="385" y2="217" stroke="#bcb6c8" /><text x="61" y="248" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,232,308,109"><tspan x="61" dy="0">Start / pause / stop</tspan><tspan x="61" dy="23">History and Past Sessions</tspan><tspan x="61" dy="23">HTTP action + content</tspan></text><rect x="475" y="165" width="390" height="185" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="491" y="197" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="491,179,358,32"><tspan x="491" dy="0">«component» System</tspan></text><line x1="475" y1="217" x2="865" y2="217" stroke="#bcb6c8" /><text x="491" y="248" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="491,232,358,109"><tspan x="491" dy="0">Authenticates owner and role</tspan><tspan x="491" dy="23">Coordinates session and DB managers</tspan><tspan x="491" dy="23">Confirms commit before cleanup</tspan></text><rect x="965" y="165" width="590" height="185" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="981" y="197" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="981,179,558,32"><tspan x="981" dy="0">«component» UserSessionCoordinator</tspan></text><line x1="965" y1="217" x2="1555" y2="217" stroke="#bcb6c8" /><text x="981" y="248" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="981,232,558,109"><tspan x="981" dy="0">Owns session lifecycle and pending summaries</tspan><tspan x="981" dy="23">Uses StopSession / GenerateSummary</tspan><tspan x="981" dy="23">SessionSummaryForDB is the handoff</tspan></text><polyline points="385,255 475,255" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="396" y="232" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="396,218,76,52"><tspan x="396" dy="0">HTTP</tspan></text><polyline points="865,255 965,255" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="880" y="232" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="880,218,75,52"><tspan x="880" dy="0">calls</tspan></text><rect x="475" y="470" width="390" height="195" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="491" y="502" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="491,484,358,32"><tspan x="491" dy="0">«component» DataBaseManager</tspan></text><line x1="475" y1="522" x2="865" y2="522" stroke="#bcb6c8" /><text x="491" y="553" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="491,537,358,119"><tspan x="491" dy="0">Implements IDataBaseManager</tspan><tspan x="491" dy="23">Receives summary; stores and fetches</tspan><tspan x="491" dy="23">SessionRepository owns SQLite SQL</tspan><tspan x="491" dy="23">Never reads or deletes temp files</tspan></text><polyline points="665,350 665,470" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="680" y="407" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="680,393,265,52"><tspan x="680" dy="0">summary save / history read</tspan></text><rect x="965" y="470" width="590" height="195" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="981" y="502" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="981,484,558,32"><tspan x="981" dy="0">«component» UserSessionDataManager</tspan></text><line x1="965" y1="522" x2="1555" y2="522" stroke="#bcb6c8" /><text x="981" y="553" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="981,537,558,119"><tspan x="981" dy="0">Owns temporary session JSON files</tspan><tspan x="981" dy="23">Atomic replacement + fsync</tspan><tspan x="981" dy="23">Retains frozen summary for retry</tspan><tspan x="981" dy="23">Deletes when session coordinator requests it</tspan></text><polyline points="1260,350 1260,470" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="1272" y="408" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="1272,394,285,52"><tspan x="1272" dy="0">temporary storage operations</tspan></text><rect x="45" y="745" width="760" height="155" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="61" y="777" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,759,728,32"><tspan x="61" dy="0">«note» Permanent information</tspan></text><line x1="45" y1="797" x2="805" y2="797" stroke="#bcb6c8" /><text x="61" y="828" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,812,728,79"><tspan x="61" dy="0">New sessions store exactly the supplied summary fields.</tspan><tspan x="61" dy="23">Existing SQL records and their detailed activity remain readable.</tspan></text><rect x="865" y="745" width="690" height="155" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="881" y="777" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="881,759,658,32"><tspan x="881" dy="0">«note» No new AI model</tspan></text><line x1="865" y1="797" x2="1555" y2="797" stroke="#bcb6c8" /><text x="881" y="828" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="881,812,658,79"><tspan x="881" dy="0">Scores/productivity come from the session component.</tspan><tspan x="881" dy="23">Optional returned analysis is stored against the original session.</tspan></text></svg>