<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>02 / Runtime classes and interfaces</title><desc>System calls both managers. The database component has no dependency on the session component.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">02 / Runtime classes and interfaces</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">System calls both managers. The database component has no dependency on the session component.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="40" y="145" width="400" height="200" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="56" y="177" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="56,159,368,32"><tspan x="56" dy="0">«module» main.py</tspan></text><line x1="40" y1="197" x2="440" y2="197" stroke="#bcb6c8" /><text x="56" y="228" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="56,212,368,124"><