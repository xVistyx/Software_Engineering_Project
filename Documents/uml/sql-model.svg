<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>04 / Persistent data and DTO mapping</title><desc>No schema migration is needed. Existing detailed archives stay readable alongside new summary-only records.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">04 / Persistent data and DTO mapping</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">No schema migration is needed. Existing detailed archives stay readable alongside new summary-only records.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="45" y="155" width="610" height="345" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="61" y="187" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,169,578,32"><tspan x="61" dy="0">«dataclass» SessionSummaryForDB</tspan></text><line x1="45" y1="207" x2="655" y2="207" stroke="#bcb6c8" /><text x="61" y="238" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,222,578,269"><tspan x="61" dy="0">session_id: int; session_topic: str</tspan><tspan x="61" dy="23">session_start_time; session_end_time</tspan><tspan x="61" dy="23">set_session_duration; actual_session_duration</tspan><tspan x="61" dy="23">productive_time; session_score</tspan><tspan x="61" dy="23">number_of_tabs; time_spent_on_tabs</tspan><tspan x="61" dy="23">most_used_tab; most_often_blocked</tspan><tspan x="61" dy="23" /><tspan x="61" dy="23">Durations: seconds; timestamps preserved</tspan></text><rect x="890" y="155" width="665" height="345" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="906" y="187" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="906,169,633,32"><tspan x="906" dy="0">«table» sessions</tspan></text><line x1="890" y1="207" x2="1555" y2="207" stroke="#bcb6c8" /><text x="906" y="238" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="906,222,633,269"><tspan x="906" dy="0">PK (user_id, id); FK user_id -&gt; users.id</tspan><tspan x="906" dy="23">Topic, status, start/end, duration columns</tspan><tspan x="906" dy="23">payload.source_summary retains all DTO fields</tspan><tspan x="906" dy="23">payload.detail_level = summary</tspan><tspan x="906" dy="23">summary stores the History display mapping</tspan><tspan x="906" dy="23">New DTOs do not supply visits or events</tspan></text><polyline points="655,325 890,325" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="674" y="294" font-family="Arial, sans-serif" font-size="14" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="674,280,203,52"><tspan x="674" dy="0">normalize supplied data</tspan></text><rect x="45" y="605" width="450" height="220" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="61" y="637" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="61,619,418,32"><tspan x="61" dy="0">«tables» users / access_keys</tspan></text><line x1="45" y1="657" x2="495" y2="657" stroke="#bcb6c8" /><text x="61" y="688" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="61,672,418,144"><tspan x="61" dy="0">Profiles own sessions</tspan><tspan x="61" dy="23">Hashed keys resolve user + role</tspan><tspan x="61" dy="23">System supplies authenticated owner</tspan><tspan x="61" dy="23">The DTO has no caller-selected user_id</tspan></text><rect x="575" y="605" width="450" height="220" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="591" y="637" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="591,619,418,32"><tspan x="591" dy="0">«table» analyses</tspan></text><line x1="575" y1="657" x2="1025" y2="657" stroke="#bcb6c8" /><text x="591" y="688" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="591,672,418,144"><tspan x="591" dy="0">PK (user_id, session_id)</tspan><tspan x="591" dy="23">FK -&gt; sessions(user_id, id)</tspan><tspan x="591" dy="23">Optional result and updated_at</tspan><tspan x="591" dy="23">Separate from immutable DTO</tspan></text><rect x="1105" y="605" width="450" height="220" rx="8" fill="#edf6f0" stroke="#bcb6c8" /><text x="1121" y="637" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="1121,619,418,32"><tspan x="1121" dy="0">«tables» Existing data</tspan></text><line x1="1105" y1="657" x2="1555" y2="657" stroke="#bcb6c8" /><text x="1121" y="688" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="1121,672,418,144"><tspan x="1121" dy="0">visits / events: older detailed records</tspan><tspan x="1121" dy="23">preferences: settings + blocklist</tspan><tspan x="1121" dy="23">legacy_imports: original sources</tspan><tspan x="1121" dy="23">Existing records are preserved</tspan></text><text x="45" y="896" font-family="Arial, sans-serif" font-size="21" fill="#292630" font-weight="600" text-anchor="start" data-bounds="45,875,1500,54"><tspan x="45" dy="0">Summary-only does not mean zero activity: unavailable visits, pauses, and event details are not invented.</tspan></text></svg>