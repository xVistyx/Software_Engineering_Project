<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>03 / Completion, commit, and cleanup</title><desc>System coordinates the order; file deletion remains inside the session component.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">03 / Completion, commit, and cleanup</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">System coordinates the order; file deletion remains inside the session component.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="35.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="51.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="51.0,154,178,32"><tspan x="51.0" dy="0">System</tspan></text><line x1="35.0" y1="192" x2="245.0" y2="192" stroke="#bcb6c8" /><polyline points="140.0,214 140.0,775" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><rect x="475.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="491.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="491.0,154,178,32"><tspan x="491.0" dy="0">Session manager</tspan></text><line x1="475.0" y1="192" x2="685.0" y2="192" stroke="#bcb6c8" /><polyline points="580.0,214 580.0,775" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><rect x="915.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="931.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="931.0,154,178,32"><tspan x="931.0" dy="0">Temp manager</tspan></text><line x1="915.0" y1="192" x2="1125.0" y2="192" stroke="#bcb6c8" /><polyline points="1020.0,214 1020.0,775" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><rect x="1355.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="1371.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="1371.0,154,178,32"><tspan x="1371.0" dy="0">DB manager / SQL</tspan></text><line x1="1355.0" y1="192" x2="1565.0" y2="192" stroke="#bcb6c8" /><polyline points="1460.0,214 1460.0,775" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><polyline points="140.0,255 580.0,255" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="152.0" y="224" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,211,416.0,42"><tspan x="152.0" dy="0">end_user_session / timer expiry</tspan></text><polyline points="580.0,325 1020.0,325" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="592.0" y="294" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="592.0,281,416.0,42"><tspan x="592.0" dy="0">Freeze end time and summary in JSON</tspan></text><polyline points="580.0,395 140.0,395" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="152.0" y="364" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,351,416.0,42"><tspan x="152.0" dy="0">Return SessionSummaryForDB</tspan></text><polyline points="140.0,465 1460.0,465" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="152.0" y="434" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,421,1296.0,42"><tspan x="152.0" dy="0">send_to_db_manager: save_session(owner, summary)</tspan></text><polyline points="1460.0,535 140.0,535" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="152.0" y="504" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,491,1296.0,42"><tspan x="152.0" dy="0">Return only after commit / verified retry</tspan></text><polyline points="140.0,605 580.0,605" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="152.0" y="574" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,561,416.0,42"><tspan x="152.0" dy="0">delete_old_session(session_id)</tspan></text><polyline points="580.0,675 1020.0,675" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="592.0" y="644" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="592.0,631,416.0,42"><tspan x="592.0" dy="0">delete_current_session_json(session_id)</tspan></text><polyline points="580.0,745 140.0,745" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="152.0" y="714" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,701,416.0,42"><tspan x="152.0" dy="0">Cleanup complete; remove pending entry</tspan></text><rect x="42" y="820" width="475" height="115" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="58" y="852" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="58,834,443,32"><tspan x="58" dy="0">«note» Database failure</tspan></text><line x1="42" y1="872" x2="517" y2="872" stroke="#bcb6c8" /><text x="58" y="903" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="58,887,443,39"><tspan x="58" dy="0">Keep terminal JSON and frozen summary.</tspan><tspan x="58" dy="23">Retry via System request/checkpoint/restart.</tspan></text><rect x="558" y="820" width="480" height="115" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="574" y="852" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="574,834,448,32"><tspan x="574" dy="0">«note» Cleanup failure</tspan></text><line x1="558" y1="872" x2="1038" y2="872" stroke="#bcb6c8" /><text x="574" y="903" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="574,887,448,39"><tspan x="574" dy="0">Retry the same summary without duplicating it.</tspan><tspan x="574" dy="23">Existing analysis remains attached.</tspan></text><rect x="1078" y="820" width="480" height="115" rx="8" fill="#fff5e3" stroke="#bcb6c8" /><text x="1094" y="852" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="1094,834,448,32"><tspan x="1094" dy="0">«note» Durable boundary</tspan></text><line x1="1078" y1="872" x2="1558" y2="872" stroke="#bcb6c8" /><text x="1094" y="903" font-family="Arial, sans-serif" font-size="16" fill="#292630" font-weight="400" text-anchor="start" data-bounds="1094,887,448,39"><tspan x="1094" dy="0">A later error cannot restore a running session.</tspan><tspan x="1094" dy="23">Different content with the same ID is rejected.</tspan></text></svg>