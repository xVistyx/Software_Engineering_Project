<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>06 / History, dashboard, and analysis</title><desc>Permanent storage receives and returns data only; every application call goes through System.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#746f7d" stroke-width="1.7" /></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="white" stroke="#746f7d" stroke-width="1.7" /></marker></defs><rect width="1600" height="1000" fill="white" /><text x="42" y="55" font-family="Arial, sans-serif" font-size="30" fill="#292630" font-weight="600" text-anchor="start" data-bounds="42,25,1516,44"><tspan x="42" dy="0">06 / History, dashboard, and analysis</tspan></text><text x="42" y="96" font-family="Arial, sans-serif" font-size="17" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,79,1516,45"><tspan x="42" dy="0">Permanent storage receives and returns data only; every application call goes through System.</tspan></text><text x="42" y="967" font-family="Arial, sans-serif" font-size="13" fill="#746f7d" font-weight="400" text-anchor="start" data-bounds="42,954,1516,32"><tspan x="42" dy="0">Grove | SQL session update | 15 September 2026 | feature/sql-summary-integration | based on bb5b28d</tspan></text><rect x="35.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="51.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="51.0,154,178,32"><tspan x="51.0" dy="0">History + tab</tspan></text><line x1="35.0" y1="192" x2="245.0" y2="192" stroke="#bcb6c8" /><polyline points="140.0,214 140.0,770" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><rect x="475.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="491.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="491.0,154,178,32"><tspan x="491.0" dy="0">System</tspan></text><line x1="475.0" y1="192" x2="685.0" y2="192" stroke="#bcb6c8" /><polyline points="580.0,214 580.0,770" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><rect x="915.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="931.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="931.0,154,178,32"><tspan x="931.0" dy="0">DB manager / SQL</tspan></text><line x1="915.0" y1="192" x2="1125.0" y2="192" stroke="#bcb6c8" /><polyline points="1020.0,214 1020.0,770" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><rect x="1355.0" y="140" width="210" height="74" rx="8" fill="#f1edf8" stroke="#bcb6c8" /><text x="1371.0" y="172" font-family="Arial, sans-serif" font-size="18" fill="#292630" font-weight="600" text-anchor="start" data-bounds="1371.0,154,178,32"><tspan x="1371.0" dy="0">AI component</tspan></text><line x1="1355.0" y1="192" x2="1565.0" y2="192" stroke="#bcb6c8" /><polyline points="1460.0,214 1460.0,770" fill="none" stroke="#746f7d" stroke-width="1.6" stroke-dasharray="7 5" /><polyline points="140.0,255 580.0,255" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="152.0" y="224" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="152.0,211,416.0,42"><tspan x="152.0" dy="0">get_sessions / get_past_sessions / details</tspan></text><polyline points="580.0,325 1020.0,325" fill="none" stroke="#746f7d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="592.0" y="294" font-family="Arial, sans-serif" font-size="13" fill="#292630" font-weight="400" text-anchor="start" data-bounds="